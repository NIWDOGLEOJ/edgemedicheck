<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 372" width="900" height="372" role="img" aria-label="Wiring diagram: Raspberry Pi 40-pin header with pin 9 to the LED common cathode, and pins 11, 13 and 15 through 330, 100 and 100 ohm resistors to the red, green and blue legs of an RGB LED.">
  <title>EdgeMediCheck status light wiring</title>
  <desc>Pin 9 (GND) goes to the LED common cathode. Pin 11 (BCM 17) goes through 330 ohms to the red leg, pin 13 (BCM 27) through 100 ohms to green, pin 15 (BCM 22) through 100 ohms to blue.</desc>

  <defs>
    <pattern id="pins" patternUnits="userSpaceOnUse" x="56" y="44" width="34" height="64">
      <rect x="10.5" y="10.5" width="15" height="15" rx="2" fill="#B4A084"/>
      <rect x="10.5" y="38.5" width="15" height="15" rx="2" fill="#B4A084"/>
    </pattern>
  </defs>

  <!-- self-contained ground so the figure reads on light and dark pages alike -->
  <rect x="0" y="0" width="900" height="372" rx="6" fill="#F5F6F8"/>
  <rect x="0.5" y="0.5" width="899" height="371" rx="6" fill="none" stroke="#D6DBE1"/>

  <!-- 40-pin header -->
  <rect x="56" y="44" width="686" height="64" rx="4" fill="#E3E7EC" stroke="#C6CDD5" stroke-width="1.5"/>
  <rect x="56" y="44" width="686" height="64" rx="4" fill="url(#pins)"/>

  <rect x="202.5" y="82.5" width="15" height="15" rx="2" fill="#9A5F2E"/>
  <rect x="236.5" y="82.5" width="15" height="15" rx="2" fill="#9A5F2E"/>
  <rect x="270.5" y="82.5" width="15" height="15" rx="2" fill="#9A5F2E"/>
  <rect x="304.5" y="82.5" width="15" height="15" rx="2" fill="#9A5F2E"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="46" y="66" text-anchor="end" font-size="11" fill="#79828E">2</text>
    <text x="46" y="94" text-anchor="end" font-size="11" fill="#79828E">1</text>
    <text x="74" y="126" text-anchor="middle" font-size="11" fill="#79828E">pin 1</text>
    <text x="210" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#9A5F2E">9</text>
    <text x="244" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#9A5F2E">11</text>
    <text x="278" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#9A5F2E">13</text>
    <text x="312" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#9A5F2E">15</text>
    <text x="752" y="80" font-size="11" fill="#79828E">40-pin</text>
    <text x="752" y="94" font-size="11" fill="#79828E">header</text>
  </g>

  <!-- wires -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 312 98 L 312 180 L 700 180" stroke="#2B5FCB"/>
    <path d="M 278 98 L 278 225 L 700 225" stroke="#178642"/>
    <path d="M 244 98 L 244 270 L 700 270" stroke="#C4362B"/>
    <path d="M 210 98 L 210 315 L 700 315" stroke="#4A525C"/>
  </g>

  <circle cx="312" cy="98" r="3.5" fill="#2B5FCB"/>
  <circle cx="278" cy="98" r="3.5" fill="#178642"/>
  <circle cx="244" cy="98" r="3.5" fill="#C4362B"/>
  <circle cx="210" cy="98" r="3.5" fill="#4A525C"/>

  <!-- resistors -->
  <rect x="460" y="172" width="60" height="16" rx="2" fill="#F5F6F8" stroke="#2B5FCB" stroke-width="2"/>
  <rect x="460" y="217" width="60" height="16" rx="2" fill="#F5F6F8" stroke="#178642" stroke-width="2"/>
  <rect x="460" y="262" width="60" height="16" rx="2" fill="#F5F6F8" stroke="#C4362B" stroke-width="2"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12">
    <text x="490" y="166" text-anchor="middle" font-weight="600" fill="#15181C">100 &#937;</text>
    <text x="490" y="211" text-anchor="middle" font-weight="600" fill="#15181C">100 &#937;</text>
    <text x="490" y="256" text-anchor="middle" font-weight="600" fill="#15181C">330 &#937;</text>
    <text x="322" y="172" fill="#4A525C">BCM 22 &#183; blue</text>
    <text x="288" y="217" fill="#4A525C">BCM 27 &#183; green</text>
    <text x="254" y="262" fill="#4A525C">BCM 17 &#183; red</text>
    <text x="220" y="307" fill="#4A525C">GND</text>
  </g>

  <!-- legs fanning into the LED -->
  <g fill="none" stroke-width="2.5" stroke-linecap="round">
    <path d="M 700 180 L 766 232" stroke="#2B5FCB"/>
    <path d="M 700 225 L 766 252" stroke="#178642"/>
    <path d="M 700 270 L 766 272" stroke="#C4362B"/>
    <path d="M 700 315 L 766 292" stroke="#4A525C"/>
  </g>

  <!-- LED -->
  <rect x="764" y="220" width="10" height="84" rx="2" fill="#E3E7EC" stroke="#C6CDD5" stroke-width="1.5"/>
  <path d="M 774 226 L 800 226 A 36 36 0 0 1 800 298 L 774 298 Z" fill="#E3E7EC" stroke="#9A5F2E" stroke-width="2" stroke-linejoin="round"/>
  <path d="M 806 244 A 22 22 0 0 1 806 280" fill="none" stroke="#C6CDD5" stroke-width="2" stroke-linecap="round"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" text-anchor="end">
    <text x="742" y="222" fill="#2B5FCB">B</text>
    <text x="742" y="244" fill="#178642">G</text>
    <text x="742" y="288" fill="#C4362B">R</text>
    <text x="742" y="312" fill="#4A525C">COM &#8722;</text>
    <text x="850" y="330" fill="#79828E">RGB LED, common cathode</text>
  </g>

  <text x="56" y="352" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" fill="#79828E">Pin 1 is the only pin with a square solder pad. Count along the odd row: 1, 3, 5, 7, 9, 11, 13, 15.</text>
</svg>
