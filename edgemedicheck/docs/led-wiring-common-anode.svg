<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 270" width="900" height="270" role="img" aria-label="Difference diagram: for a common-anode LED the common leg moves from pin 9 (ground) to pin 1 (3.3 volts); the three colour wires stay where they are.">
  <title>Common-anode variant</title>
  <desc>Only the common leg changes end: it goes to pin 1 (3V3) instead of pin 9 (GND). The red, green and blue legs keep their pins and resistors.</desc>

  <defs>
    <pattern id="pins-anode" patternUnits="userSpaceOnUse" x="56" y="44" width="34" height="64">
      <rect x="10.5" y="10.5" width="15" height="15" rx="2" fill="#B4A084"/>
      <rect x="10.5" y="38.5" width="15" height="15" rx="2" fill="#B4A084"/>
    </pattern>
  </defs>

  <rect x="0" y="0" width="900" height="270" rx="6" fill="#F5F6F8"/>
  <rect x="0.5" y="0.5" width="899" height="269" rx="6" fill="none" stroke="#D6DBE1"/>

  <rect x="56" y="44" width="686" height="64" rx="4" fill="#E3E7EC" stroke="#C6CDD5" stroke-width="1.5"/>
  <rect x="56" y="44" width="686" height="64" rx="4" fill="url(#pins-anode)"/>

  <rect x="66.5" y="82.5" width="15" height="15" rx="2" fill="#9A5F2E"/>
  <rect x="202.5" y="82.5" width="15" height="15" rx="2" fill="#79828E"/>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="74" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#9A5F2E">1</text>
    <text x="74" y="142" text-anchor="middle" font-size="11" fill="#9A5F2E">3V3</text>
    <text x="210" y="126" text-anchor="middle" font-size="12" font-weight="600" fill="#79828E">9</text>
    <text x="210" y="142" text-anchor="middle" font-size="11" fill="#79828E">GND</text>
  </g>

  <!-- the wiring this replaces -->
  <path d="M 500 180 L 470 180 L 470 160 L 210 160 L 210 98" fill="none" stroke="#79828E" stroke-width="2.5"
        stroke-dasharray="7 6" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="490" y="152" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
        fill="#79828E">common cathode &#8212; pin 9</text>

  <!-- where it goes instead -->
  <path d="M 500 180 L 470 180 L 470 220 L 74 220 L 74 98" fill="none" stroke="#9A5F2E" stroke-width="2.5"
        stroke-linecap="round" stroke-linejoin="round"/>
  <text x="490" y="230" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12"
        font-weight="600" fill="#9A5F2E">common anode &#8212; pin 1</text>

  <circle cx="500" cy="180" r="4" fill="#15181C"/>
  <path d="M 500 180 L 766 180" fill="none" stroke="#15181C" stroke-width="2.5" stroke-linecap="round"/>
  <text x="700" y="170" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#4A525C">common leg</text>

  <rect x="764" y="148" width="10" height="64" rx="2" fill="#E3E7EC" stroke="#C6CDD5" stroke-width="1.5"/>
  <path d="M 774 152 L 796 152 A 28 28 0 0 1 796 208 L 774 208 Z" fill="#E3E7EC" stroke="#9A5F2E" stroke-width="2" stroke-linejoin="round"/>
  <text x="850" y="234" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace"
        font-size="11" fill="#79828E">R &#183; G &#183; B legs unchanged</text>

  <text x="56" y="254" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11"
        fill="#79828E">Set EMC_LIGHT_COMMON_ANODE=1 so the driver inverts every level it writes.</text>
</svg>
